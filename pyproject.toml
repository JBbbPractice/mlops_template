[project]
name = "mlops-template"
version = "1.1.0"
description = "Template to ensure best practices for collaborative AI system development"
readme = "README.md"
requires-python = ">=3.13"

# DEPENDENCIES

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "pytest",
    "rust-just",
    "copier",
    "typer",
    "pyyaml"
]

# TOOLS

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
markers = [
    "fast: Fast tests that validate basic structure",
    "quality: Tests that run quality gates on generated projects",
    "slow: Slow tests that run full automation suite",
    "automation: Tests for automation commands",
    "parametrized: Tests with parameter variations",
]
