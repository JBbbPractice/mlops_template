# PROJECT

[project]
name = "{{cookiecutter.repository}}"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author}}" }]
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = []

# SCRIPTS

[project.scripts]
{{cookiecutter.repository}} = "{{cookiecutter.package}}.scripts:main"

# DEPENDENCIES

[dependency-groups]
quality = [
    "bandit",
    "coverage",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]
version = ["commitizen", "pre-commit"]
dev = ["rust-just", "typer"]
doc = ["pdoc"]
notebook = ["ipykernel", "nbformat"]

# TOOLS

[tool.uv]
default-groups = ["quality", "version", "dev", "doc", "notebook"]

[tool.bandit]
targets = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.mypy]
pretty = true
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]

# SYSTEMS

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
