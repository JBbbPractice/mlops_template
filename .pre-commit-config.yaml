# Configure the pre-commit check to run before making a commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v5.0.0'
    hooks:
      - id: check-added-large-files

    # Find vunerabilities
  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.6"
    hooks:
      - id: bandit

    # Check commit msgs
  - repo: https://github.com/commitizen-tools/commitizen
    rev: "v4.8.3" # Use a recent version
    hooks:
      - id: commitizen
        stages: [commit-msg]

    # Secret scan
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data.
        entry: bash -c 'trufflehog git file://. --since-commit HEAD --results=verified,unknown --fail --no-update'
        language: system
        stages: ["pre-commit"]
